# Hawser edge agent.
#
# ⚠️ NOT a Dockhand From-Git stack, and it must never become one. This file is
# the single source of the agent's compose; `roles/hawser` in ansible-playbooks
# fetches it over HTTPS at a pinned commit and brings it up over SSH. Dockhand
# never deploys it.
#
# That is not a preference. It was tried on the lab node on 2026-08-13 and the
# node lost management: deploying this stack through Dockhand makes the agent run
# `compose up` on the project that contains the agent. It stopped its own
# container, and the replacement was left in `Created` — the process that would
# have started it was inside the container it had just stopped. `restart:
# unless-stopped` does not apply to a container that never ran. Recovery was an
# Ansible run over SSH.
#
# The same reasoning rules out the first install: Dockhand reaches a node only
# through Hawser, so a node without an agent cannot be sent one.
#
# Values come from a `.env` written next to this file by roles/hawser — TOKEN is
# a real secret and lives only there (0600, no_log), never in this file.
services:
  hawser:
    image: ghcr.io/finsys/hawser:0.2.46
    container_name: hawser
    restart: unless-stopped
    environment:
      DOCKHAND_SERVER_URL: ${DOCKHAND_SERVER_URL:?DOCKHAND_SERVER_URL must be set in .env, e.g. wss://dockhand.example.com/api/hawser/connect}
      # The token Dockhand issued for THIS environment. A wrong-but-plausible
      # value strands the host: the agent starts, fails to authenticate, and the
      # only way back is a run of hawser.yml over SSH.
      TOKEN: ${TOKEN:?TOKEN must be set in .env — the agent token issued for this environment}
      STACKS_DIR: ${STACKS_DIR:-/opt/hawser-stacks}
      # Upstream default is 30s, which cancels a From-Git deploy mid-pull on a
      # slow host — measured, ansible-playbooks #12.
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
    volumes:
      # Long form with create_host_path: false. The short form would silently
      # create a DIRECTORY named docker.sock if the path were ever wrong, and the
      # agent would come up healthy with no way to reach Docker at all.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      # Identical path on both sides, and that is load-bearing: the agent hands
      # compose file paths to the Docker daemon, which resolves them in the HOST
      # namespace. A different path inside the container would make every stack
      # it deploys point at nothing.
      - type: bind
        source: ${STACKS_DIR:-/opt/hawser-stacks}
        target: ${STACKS_DIR:-/opt/hawser-stacks}
        bind:
          create_host_path: false
