---
# golangci-lint configuration for acme-hook.
#
# The default set (errcheck, govet, ineffassign, staticcheck, unused) is kept and
# three linters are added for what this particular service is: a small network
# server that holds a Cloudflare token.
version: "2"

linters:
  default: standard
  enable:
    # Every Cloudflare call returns a response whose body must be closed, or the
    # connection leaks. Easy to get right once and lose in a later edit.
    - bodyclose
    # Security-oriented checks. It is the linter most likely to have an opinion
    # about a process that reads a secret from the environment and opens a port.
    - gosec
    # A request must not be made without a context in code that could hang; here
    # it also flags the http.NewRequest calls that should carry one.
    - noctx
    # Comparing errors with == instead of errors.Is silently stops working the
    # moment an error is wrapped, and this code wraps with %w.
    - errorlint

  exclusions:
    rules:
      # G706 flags the three log lines that print the challenge record name,
      # because it is derived from the X-Acme-Domain header and the taint
      # analysis is flow-insensitive: it cannot see that every path to those
      # lines passes through checkDomain, whose isDNSName gate makes a line
      # break impossible. TestCheckDomain covers exactly that, including the
      # newline case, so the claim is checked rather than asserted.
      #
      # The values are also printed with %q, which escapes a break even if the
      # gate were ever weakened. Remove this exclusion if either goes away.
      - path: main\.go
        linters:
          - gosec
        text: G706
