# remnanode — Angie: REALITY fallback, decoy site, xHTTP entry, ACME.
# Every section is explained in README.md, "angie.conf". Rendered by gomplate at
# container start: apply a change with `docker restart remnawave-angie`, and
# never write gomplate's double braces in a comment.
{{- $node_name      := getenv "NODE_NAME" }}
{{- $acme_domain    := getenv "ACME_DOMAIN" }}
{{- $xhttp_path     := getenv "XHTTP_PATH" }}
{{- $xhttp_upstream := getenv "XHTTP_UPSTREAM" "grpc" }}
{{- $stock_errors   := dict "400" "400 Bad Request" "403" "403 Forbidden" "405" "405 Not Allowed" "412" "412 Precondition Failed" "413" "413 Request Entity Too Large" "414" "414 Request-URI Too Large" "416" "416 Requested Range Not Satisfiable" "494" "400 Request Header Or Cookie Too Large" "500" "500 Internal Server Error" "501" "501 Not Implemented" "502" "502 Bad Gateway" "503" "503 Service Temporarily Unavailable" "504" "504 Gateway Time-out" "505" "505 HTTP Version Not Supported" }}
{{- if not (and $node_name $acme_domain) }}
{{- test.Fail "NODE_NAME and ACME_DOMAIN must both be set" }}
{{- end }}
{{- if not (or (eq $xhttp_upstream "grpc") (eq $xhttp_upstream "http")) }}
{{- test.Fail (printf "XHTTP_UPSTREAM must be grpc or http, got %q" $xhttp_upstream) }}
{{- end }}


# --- 1. Server identity ------------------------------------------------------

server_tokens                  off;
more_set_headers               "Server: nginx";
server_names_hash_bucket_size  64;


# --- 2. TLS ------------------------------------------------------------------

ssl_protocols              TLSv1.2 TLSv1.3;
ssl_ecdh_curve             X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers  off;
ssl_session_timeout        1d;
ssl_session_cache          shared:MozSSL:10m;
ssl_session_tickets        off;


# --- 3. ACME client ----------------------------------------------------------

acme_client  letsencrypt  https://acme-v02.api.letsencrypt.org/directory  challenge=dns;


# --- 4. Node virtual host ----------------------------------------------------

server {
    listen       unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name  {{ $node_name }}.{{ $acme_domain }};
    http2        on;

    set_real_ip_from  unix:;
    real_ip_header    proxy_protocol;

    acme                 letsencrypt;
    ssl_certificate      $acme_cert_letsencrypt;
    ssl_certificate_key  $acme_cert_key_letsencrypt;

    add_header  Strict-Transport-Security  "max-age=63072000"  always;
    add_header  Alt-Svc  'h3=":443"; ma=86400'  always;
    add_header  X-Robots-Tag  "noindex, nofollow, noarchive, nosnippet, noimageindex"  always;

    root   /var/www/html;
    index  index.html;

    error_page  404  /index.html;
{{- range $code, $status := $stock_errors }}
    error_page  {{ $code }}  /__error_page/{{ $code }};
{{- end }}

    location / {
        try_files   $uri $uri/ =404;

        gzip        on;
        gzip_vary   on;
        gzip_types  text/css application/javascript application/json image/svg+xml;
    }
{{- if $xhttp_path }}

    location {{ $xhttp_path }} {
        access_log            off;
        client_max_body_size  0;
        client_body_timeout   5m;
{{- if eq $xhttp_upstream "http" }}

        proxy_http_version       1.1;
        proxy_request_buffering  off;
        proxy_buffering          off;
        proxy_read_timeout       1h;
        proxy_send_timeout       1h;
        proxy_set_header  Host             $host;
        proxy_set_header  X-Real-IP        $proxy_protocol_addr;
        proxy_set_header  X-Forwarded-For  $proxy_protocol_addr;
        proxy_pass        http://unix:/dev/shm/xhttp.sock;
{{- else }}

        grpc_read_timeout  1h;
        grpc_send_timeout  1h;
        grpc_set_header    X-Real-IP        $proxy_protocol_addr;
        grpc_set_header    X-Forwarded-For  $proxy_protocol_addr;
        grpc_pass          unix:/dev/shm/xhttp.sock;
{{- end }}
    }
{{- end }}

{{- range $code, $status := $stock_errors }}
    location = /__error_page/{{ $code }} { internal; default_type text/html; return {{ strings.Trunc 3 $status }} "<html>\r\n<head><title>{{ $status }}</title></head>\r\n<body>\r\n<center><h1>{{ $status }}</h1></center>\r\n<hr><center>nginx</center>\r\n</body>\r\n</html>\r\n"; }
{{- end }}
}


# --- 5. Catch-all virtual host -----------------------------------------------

server {
    listen       unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name  _;

    ssl_reject_handshake  on;
    return                444;
}


# --- 6. ACME DNS-01 hook -----------------------------------------------------

server {
    listen  127.0.0.1:9000;

    location / {
        acme_hook  letsencrypt;

        proxy_set_header  X-Acme-Op       "$acme_hook_name";
        proxy_set_header  X-Acme-Domain   "$acme_hook_domain";
        proxy_set_header  X-Acme-Keyauth  "$acme_hook_keyauth";
        proxy_pass        http://127.0.0.1:9001;
    }
}
