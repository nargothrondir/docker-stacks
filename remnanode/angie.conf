server_names_hash_bucket_size 64;

#server_tokens "";
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# --- Angie native ACME (issue #13). DNS-01 via the Cloudflare hook (acme-hook
# service) — no inbound port is opened. PRODUCTION Let's Encrypt: this is the
# end state (main) and issues browser-trusted certs. State persists in the
# angie-acme volume — clear it once when switching CA (staging↔prod) so a new
# account/cert is created cleanly. Note: since each node now issues for its own
# name (see below), the duplicate-certificate limit no longer binds the fleet
# together — nodes no longer share one SAN set.
#
# No `resolver` directive on purpose. Angie 1.12 reads /etc/resolv.conf itself
# and watches it for changes, and this container runs with network_mode: host,
# so that is the HOST's file — the same resolver apt, NetBird and everything
# else on the node uses. A hardcoded `resolver 1.1.1.1 8.8.8.8` made the ACME
# client a second, independent DNS path that ignored the node's configuration
# and asked in plaintext.
#
# The only consumer here is the ACME client below, resolving the Let's Encrypt
# directory — a handful of lookups at issuance and renewal, and precisely the
# ones that reveal which name is getting a certificate and when.
#
# Verified on the wire (lab node, 2026-08-10): with this directive removed and
# the ACME state wiped, Angie reached the LE directory and logged an account ID.
# tcpdump over the whole issuance: 16 packets to the resolved stub on
# 127.0.0.53, 62 to the upstream on 853, ZERO to 1.1.1.1:53 or 8.8.8.8:53.
acme_client letsencrypt https://acme-v02.api.letsencrypt.org/directory challenge=dns;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;

# Camouflage site for the reality fallback. Each node issues a cert for its OWN
# name (NODE_NAME.ACME_DOMAIN, e.g. pl.example.com) — NOT a fleet-wide wildcard.
# So a node's cert key is valid only for that node's name (a compromised node
# can't impersonate panel/other nodes), and distinct names avoid the LE
# duplicate-cert limit. The client's SNI (set per node in the panel) matches
# this exact name. Phase 1 of #21 option A; the CF token is still zone-wide
# (that is Phase 2 — acme-dns delegation).
server {
    server_name {{ .Env.NODE_NAME }}.{{ .Env.ACME_DOMAIN }};
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    # Issue/renew this node's cert via ACME (harvested from server_name above)
    # and serve it straight from the acme_client volume — no certbot, no file
    # bind-mounts. ssl_trusted_certificate is dropped (the file source is gone;
    # OCSP stapling is not needed for the reality fallback).
    acme letsencrypt;

    ssl_certificate $acme_cert_letsencrypt;
    ssl_certificate_key $acme_cert_key_letsencrypt;

    root /var/www/html;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # VLESS over xHTTP (ansible-playbooks archive #42). A client speaks plain TLS
    # to 443; reality does not recognise the handshake and relays it here, the
    # same way it relays a browser. This block terminates TLS with the node's
    # own certificate and hands one secret path to the xHTTP inbound, which
    # listens on a unix socket with no security of its own. Every other path is
    # still the decoy site.
    #
    # Rendered only when XHTTP_PATH is set, so a node enables xHTTP by getting
    # the variable — one node at a time, from dockhand-stack.yml — not by this
    # file reaching the fleet. An empty value is a legitimate state here
    # ("xHTTP not enabled"), not a misconfiguration, which is why the compose
    # file does not declare it with :? like NODE_NAME. The path lives in
    # OpenBao, never in git: it is what lets a prober tell this node from a
    # plain website.
    #
    # grpc_pass, not proxy_pass: the gRPC module speaks HTTP/2 to the socket and
    # streams the request body as it arrives. proxy_pass buffers the body first
    # by default — to disk past client_body_buffer_size — which packet-up
    # survives slowly and stream-up not at all. Same shape as
    # XTLS/Xray-examples VLESS-XHTTP3-Nginx.
    #
    # The grpc_* timeouts are an hour, not the example's 315 s. 315 was chosen
    # to sit just above Xray's own idle timeout (ConnectionIdle 300 s, Xray
    # v26.6.27 policy defaults), so that Xray, which watches BOTH directions,
    # closes an idle connection first. But Angie watches one stream at a time:
    # a download stream that stays silent while the client keeps uploading — a
    # big file whose server answers only at the end — is alive to Xray and was
    # cut by Angie at 315 s ("upstream timed out (110) while reading upstream",
    # first node, 2026-09-23). An hour leaves the decision to Xray and keeps
    # Angie's timeout as a backstop only.
    #
    # "upstream prematurely closed connection" is still logged when Xray ends a
    # stream on its own idle timeout: xHTTP is not gRPC and sends no trailers.
    # That line is the normal end of an idle connection, not a fault.
    #
    # client_max_body_size 0: a packet-up POST is up to 1 000 000 bytes
    # (scMaxEachPostBytes), right at the 1m default.
    #
    # X-Forwarded-For carries the client address from the PROXY protocol header
    # reality sent. Xray honours it only when the inbound's
    # sockopt.trustedXForwardedFor names a header that is present — X-Real-IP,
    # set here; otherwise it logs a warning per request and records the socket.
    # Both are overwritten, so a client cannot forge them.
    #
    # access_log off: in packet-up every upload chunk is its own POST, and the
    # client pads each request's Referer with 100-1000 bytes (xPaddingBytes).
    # Measured on the first node (2026-09-23): ~900 bytes a line, ~1 MB of log
    # in three minutes of one client — gigabytes a day for a profile's users.
    # Worse than the volume, every line holds the secret path and a timeline of
    # who moved how much: a seized node would hand over both. The decoy site
    # keeps its log; probes and scanners are worth seeing there.
    #
    # XHTTP_UPSTREAM picks how Angie talks to the inbound, per node, for an A/B
    # comparison: "grpc" (default) is grpc_pass as above; "http" is proxy_pass
    # over HTTP/1.1 with BOTH buffers off. proxy_request_buffering off is the
    # line that matters — without it Angie reads each request body whole before
    # passing it on, which packet-up survives slowly and stream-up not at all.
    # proxy_buffering off is stated rather than left to the X-Accel-Buffering
    # header Xray sends. Any other value fails the render, so a typo stops the
    # container instead of quietly running the default.
{{- if getenv "XHTTP_PATH" }}
{{- $upstream := getenv "XHTTP_UPSTREAM" "grpc" }}
{{- if not (or (eq $upstream "grpc") (eq $upstream "http")) }}
{{- test.Fail (printf "XHTTP_UPSTREAM must be grpc or http, got %q" $upstream) }}
{{- end }}
    location {{ getenv "XHTTP_PATH" }} {
        access_log off;
        client_max_body_size 0;
        client_body_timeout 5m;
{{- if eq $upstream "http" }}
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_pass http://unix:/dev/shm/xhttp.sock;
{{- else }}
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        grpc_set_header X-Real-IP $proxy_protocol_addr;
        grpc_set_header X-Forwarded-For $proxy_protocol_addr;
        grpc_pass unix:/dev/shm/xhttp.sock;
{{- end }}
    }
{{- end }}
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    ssl_reject_handshake on;
    return 444;
}

# ACME DNS-01 hook: Angie makes an internal request here for each add/remove of
# the _acme-challenge TXT record (as a GET) and passes the challenge variables;
# we forward them as headers to the Cloudflare hook backend (acme-hook service).
server {
    listen 127.0.0.1:9000;
    location / {
        acme_hook letsencrypt;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header X-Acme-Op "$acme_hook_name";
        proxy_set_header X-Acme-Domain "$acme_hook_domain";
        proxy_set_header X-Acme-Keyauth "$acme_hook_keyauth";
    }
}
