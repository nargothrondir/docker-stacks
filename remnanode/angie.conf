# =============================================================================
# remnanode — Angie: REALITY fallback, decoy site, xHTTP entry, ACME
# =============================================================================
#
# Where this file goes: mounted as /etc/angie/templates/http.d/default.conf.
# The -templated image renders it with gomplate at container START and the
# result is included inside http {} — so everything here is http-level or a
# server block, and a change reaches a node only when remnawave-angie restarts
# (README: "A change to angie.conf does not reach a running node on its own").
#
# Template syntax is gomplate's double curly braces; Angie's own $variables are
# untouched. Never write those braces in a comment: gomplate parses them there
# too, and an empty pair fails the render.
#
# Traffic:
#
#   :443/tcp  xray REALITY ──(not a REALITY client)──▶ unix:/dev/shm/nginx.sock
#                 ├─ SNI = this node's name ─▶ [4] decoy site
#                 │                               └─ XHTTP_PATH ─▶ xray xHTTP inbound
#                 └─ any other SNI ──────────▶ [5] handshake refused
#   127.0.0.1:9000 ─▶ [6] ACME DNS-01 hook ─▶ acme-hook service
#
# Contents:
#   1. Server identity
#   2. TLS
#   3. ACME client
#   4. Virtual host — this node's name: decoy site + xHTTP
#   5. Virtual host — any other name: refused
#   6. Internal — ACME DNS-01 hook
#
# The reasons behind each choice are in README.md; comments here say what a
# line does and point there when the why is longer than a line.
{{- /*
  Template inputs: every environment variable this file reads, read once here.
  Required values fail the render when empty (compose also declares them with
  :?); an unknown XHTTP_UPSTREAM fails it too, so a typo stops the container
  instead of quietly running the default.
*/}}
{{- $node_name      := getenv "NODE_NAME" }}
{{- $acme_domain    := getenv "ACME_DOMAIN" }}
{{- $xhttp_path     := getenv "XHTTP_PATH" }}
{{- $xhttp_upstream := getenv "XHTTP_UPSTREAM" "grpc" }}
{{- if not (and $node_name $acme_domain) }}
{{- test.Fail "NODE_NAME and ACME_DOMAIN must both be set" }}
{{- end }}
{{- if not (or (eq $xhttp_upstream "grpc") (eq $xhttp_upstream "http")) }}
{{- test.Fail (printf "XHTTP_UPSTREAM must be grpc or http, got %q" $xhttp_upstream) }}
{{- end }}


# =============================================================================
# 1. Server identity
# =============================================================================

# No version in the Server header or on error pages. Replacing the name itself
# ("Angie") takes Angie PRO; the open-source build accepts on | off | build.
server_tokens                  off;
server_names_hash_bucket_size  64;


# =============================================================================
# 2. TLS — shared by every ssl listener below
# =============================================================================
# This handshake is what every TCP client of the node sees: REALITY borrows it
# as its camouflage (and uses X25519MLKEM768 with clients that offer it, once
# this server does), xHTTP clients and browsers end their TLS here.
# Profile: Mozilla "intermediate", guidelines 6.0 — README: "TLS".

ssl_protocols              TLSv1.2 TLSv1.3;
ssl_ecdh_curve             X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers  off;
ssl_session_timeout        1d;
ssl_session_cache          shared:MozSSL:10m;
ssl_session_tickets        off;


# =============================================================================
# 3. ACME client — this node's certificate
# =============================================================================
# Let's Encrypt, DNS-01 through the hook in [6]: no inbound port is opened.
# State (account key + certificates) lives in the angie-acme volume, which
# remnanode also mounts read-only for Hysteria2. No `resolver` directive on
# purpose: Angie then uses the host's own encrypted resolver.
# README: "Certificates".

acme_client  letsencrypt  https://acme-v02.api.letsencrypt.org/directory  challenge=dns;


# =============================================================================
# 4. Virtual host — this node's name: decoy site + xHTTP
# =============================================================================

server {
    listen       unix:/dev/shm/nginx.sock ssl proxy_protocol;
    server_name  {{ $node_name }}.{{ $acme_domain }};
    http2        on;

    # --- TLS: the certificate for exactly this name, issued and renewed by [3]
    acme                 letsencrypt;
    ssl_certificate      $acme_cert_letsencrypt;
    ssl_certificate_key  $acme_cert_key_letsencrypt;

    # --- Response headers
    add_header  X-Robots-Tag  "noindex, nofollow, noarchive, nosnippet, noimageindex"  always;

    # --- Decoy site, one per node (CAMO_SITE) — README: "Reality camouflage"
    root   /var/www/html;
    index  index.html;
{{- if $xhttp_path }}

    # --- xHTTP entry — README: "xHTTP"
    # One secret path (XHTTP_PATH) goes to the xray xHTTP inbound on a unix
    # socket; every other path stays the decoy site. Rendered only when the
    # node has XHTTP_PATH. XHTTP_UPSTREAM picks the hop: grpc (default,
    # grpc_pass) or http (proxy_pass, unbuffered).
    location {{ $xhttp_path }} {
        access_log            off;   # each packet-up POST, with the secret path
        client_max_body_size  0;     # a packet-up POST is up to 1 MB
        client_body_timeout   5m;
{{- if eq $xhttp_upstream "http" }}

        proxy_http_version       1.1;
        proxy_request_buffering  off;   # stream the body as it arrives
        proxy_buffering          off;
        proxy_read_timeout       1h;    # Xray decides idleness, not Angie
        proxy_send_timeout       1h;
        proxy_set_header  Host             $host;
        proxy_set_header  X-Real-IP        $proxy_protocol_addr;
        proxy_set_header  X-Forwarded-For  $proxy_protocol_addr;
        proxy_pass        http://unix:/dev/shm/xhttp.sock;
{{- else }}

        grpc_read_timeout  1h;          # Xray decides idleness, not Angie
        grpc_send_timeout  1h;
        grpc_set_header    X-Real-IP        $proxy_protocol_addr;
        grpc_set_header    X-Forwarded-For  $proxy_protocol_addr;
        grpc_pass          unix:/dev/shm/xhttp.sock;
{{- end }}
    }
{{- end }}
}


# =============================================================================
# 5. Virtual host — any other name: refused
# =============================================================================

server {
    listen       unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name  _;

    # A handshake for any other SNI is refused before a certificate is shown.
    ssl_reject_handshake  on;

    # A request whose Host names no server lands here even after a handshake on
    # this node's name: close the connection without an answer.
    return  444;
}


# =============================================================================
# 6. Internal — ACME DNS-01 hook
# =============================================================================
# The ACME client calls this for each add/remove of the _acme-challenge TXT
# record; the request is passed on as headers to the acme-hook service, which
# holds the DNS token. Loopback only. README: "The DNS-01 hook".

server {
    listen  127.0.0.1:9000;

    location / {
        acme_hook  letsencrypt;

        proxy_set_header  X-Acme-Op       "$acme_hook_name";
        proxy_set_header  X-Acme-Domain   "$acme_hook_domain";
        proxy_set_header  X-Acme-Keyauth  "$acme_hook_keyauth";
        proxy_pass        http://127.0.0.1:9001;
    }
}
